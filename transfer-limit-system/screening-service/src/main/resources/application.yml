spring.application.name: screening-service
spring.kafka:
  admin:
    modify-topic-configs: true
  consumer:
    auto-offset-reset: earliest
    key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
    properties:
      spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.LongDeserializer
      spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      spring.json.trusted.packages: "*"
  producer:
    key-serializer: org.apache.kafka.common.serialization.LongSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      max.block.ms: 5000
      request.timeout.ms: 5000
      delivery.timeout.ms: 10000

spring.datasource:
  url: jdbc:postgresql://localhost:5433/screeningdb
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

spring.jpa:
  hibernate:
    ddl-auto: none
  show-sql: true

spring.liquibase:
  change-log: classpath:db/changelog/changelog-master.yaml
