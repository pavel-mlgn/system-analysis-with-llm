services:
  broker:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  transfer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: transferdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - transfer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "transferdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  limit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: limitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - limit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "limitdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  screening-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: screeningdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - screening-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "screeningdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  transfer-service:
    image: transfer-limit-system/transfer-service:1.0-SNAPSHOT
    build:
      context: .
      args:
        MODULE: transfer-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
      transfer-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

  limit-service:
    image: transfer-limit-system/limit-service:1.0-SNAPSHOT
    build:
      context: .
      args:
        MODULE: limit-service
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      limit-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

  screening-service:
    image: transfer-limit-system/screening-service:1.0-SNAPSHOT
    build:
      context: .
      args:
        MODULE: screening-service
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      screening-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  kafka-data:
  transfer-data:
  limit-data:
  screening-data:
